<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K0maru TV — Смотрите мультики и не только!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">

<style>
:root{
  --accent:#a855f7;
  --accent-light:#c084fc;
  --accent-dark:#7e22ce;
  --bg:#0a0612;
  --text:#ffffff;
  --dim:#a89bc4;
  --border:rgba(168,85,247,.22);
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

/* Фон */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(1000px 600px at 50% 0%, rgba(168,85,247,.28), transparent 60%),
    radial-gradient(800px 500px at 50% 100%, rgba(126,34,206,.22), transparent 60%);
  z-index:-2;pointer-events:none;
  animation:bgShift 20s ease-in-out infinite;
}
@keyframes bgShift{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-1.5%,1.5%) scale(1.04)}
}

body::after{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(168,85,247,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(168,85,247,.05) 1px, transparent 1px);
  background-size:56px 56px;
  z-index:-1;
  mask-image:radial-gradient(circle at 50% 50%, #000 15%, transparent 75%);
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 15%, transparent 75%);
  pointer-events:none;
}

/* Контейнер */
.wrap{
  text-align:center;
  max-width:640px;
  width:100%;
}

/* Заголовок */
.title{
  font-size:clamp(28px,5vw,52px);
  font-weight:900;
  letter-spacing:-1px;
  line-height:1.1;
  margin-bottom:10px;
}

.title .k0{
  background:linear-gradient(135deg,var(--accent-light),var(--accent),var(--accent-dark));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  background-size:200% 200%;
  animation:gradientMove 5s ease infinite;
}

@keyframes gradientMove{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}

.subtitle{
  color:var(--accent-light);
  font-size:clamp(14px,2vw,19px);
  font-weight:600;
  margin-bottom:30px;
}

/* Карточка статуса */
.card{
  position:relative;
  padding:3px;
  border-radius:20px;
  background:linear-gradient(135deg,
    rgba(168,85,247,.7),
    rgba(126,34,206,.5),
    rgba(192,132,252,.7),
    rgba(168,85,247,.7));
  background-size:300% 300%;
  animation:borderFlow 8s linear infinite;
  box-shadow:
    0 30px 80px rgba(0,0,0,.6),
    0 0 60px rgba(168,85,247,.3);
}

@keyframes borderFlow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.card-inner{
  border-radius:17px;
  background:linear-gradient(160deg,rgba(23,14,40,.95),rgba(10,6,18,.95));
  padding:40px 30px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}

.icon{
  font-size:64px;
  filter:drop-shadow(0 0 24px var(--accent));
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.status-title{
  font-size:22px;
  font-weight:800;
  background:linear-gradient(135deg,var(--accent-light),var(--accent));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.status-text{
  color:var(--dim);
  font-size:14px;
  line-height:1.6;
  max-width:420px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:rgba(168,85,247,.15);
  color:var(--accent-light);
  border:1px solid rgba(168,85,247,.4);
  padding:6px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1.4px;
  margin-top:6px;
}

.dot{
  width:8px;height:8px;
  background:#22c55e;
  border-radius:50%;
  animation:pulse 1.4s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(.7)}
}

/* Футер */
.footer{
  margin-top:24px;
  color:var(--dim);
  font-size:13px;
}

.footer .heart{
  color:var(--accent-light);
  display:inline-block;
  animation:beat 1.4s infinite;
}

@keyframes beat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.25)}
}
</style>
</head>
<body>

<div class="wrap">

  <h1 class="title">
    <span class="k0">K0</span>maru TV
  </h1>

  <p class="subtitle">Смотрите мультики и не только! 🐱</p>

  <div class="card">
    <div class="card-inner">
      <div class="icon">✅</div>
      <div class="status-title">Сайт работает!</div>
      <p class="status-text">
        Если вы видите эту страницу — значит GitHub Pages настроены правильно,
        и сайт K0maru TV успешно залит.
      </p>
      <div class="badge">
        <span class="dot"></span>
        Тест пройден
      </div>
    </div>
  </div>

  <div class="footer">
    © 2026 K0maru TV · Сделано с <span class="heart">♥</span>
  </div>

</div>

</body>
</html>
